<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp Response Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7f9;
  --surface:#ffffff;
  --border:#e6e8ec;
  --text:#0f172a;
  --muted:#64748b;
  --accent:#16a34a;
  --accent-soft:rgba(22,163,74,.10);
  --grid:rgba(15,23,42,.045);
  --brick:#e2734a;
  --hat:#f59e0b;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 12px 32px -12px rgba(15,23,42,.12);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0b0f14;
    --surface:#11161d;
    --border:#1f2731;
    --text:#e6edf3;
    --muted:#8b98a7;
    --accent:#22c55e;
    --accent-soft:rgba(34,197,94,.12);
    --grid:rgba(255,255,255,.035);
    --brick:#ee8357;
    --hat:#fbbf24;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 16px 40px -16px rgba(0,0,0,.6);
  }
}

*{box-sizing:border-box;}
html,body{height:100%;}

body{
  margin:0;
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  display:flex;
  flex-direction:column;
  min-height:100vh;
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:44px 44px;
  background-position:center center;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:radial-gradient(600px circle at 50% 45%,var(--accent-soft),transparent 70%);
  pointer-events:none;
}

/* HEADER */
.header{
  position:relative;
  height:64px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 28px;
  background:color-mix(in srgb,var(--surface) 80%,transparent);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  font-size:15px;
  font-weight:600;
  letter-spacing:-.01em;
}
.logo{
  width:28px;height:28px;
  border-radius:8px;
  background:var(--accent);
  display:grid;place-items:center;
  flex-shrink:0;
}

/* MAIN */
.wrap{
  position:relative;
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px 16px;
}
.card{
  width:100%;
  max-width:500px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:var(--shadow);
  padding:40px 36px 38px;
  text-align:center;
  animation:rise .6s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes rise{
  from{opacity:0;transform:translateY(12px);}
  to{opacity:1;transform:none;}
}

.status{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:6px 12px;
  border-radius:999px;
  background:var(--accent-soft);
  color:var(--accent);
  font-size:12px;
  font-weight:600;
  letter-spacing:.02em;
  margin-bottom:18px;
}
.dot{
  position:relative;
  width:8px;height:8px;
  border-radius:50%;
  background:var(--accent);
}
.dot::after{
  content:"";
  position:absolute;inset:0;
  border-radius:50%;
  background:var(--accent);
  animation:ping 1.8s cubic-bezier(0,0,.2,1) infinite;
}
@keyframes ping{
  75%,100%{transform:scale(2.4);opacity:0;}
}

h1{
  font-size:26px;
  font-weight:700;
  letter-spacing:-.025em;
  margin:0 0 10px;
}
p{
  font-size:15px;
  line-height:1.65;
  color:var(--muted);
  margin:0 auto;
  max-width:360px;
}

.scene{
  width:100%;
  max-width:360px;
  margin:0 auto 22px;
}
.scene svg{display:block;width:100%;height:auto;overflow:visible;}

.emo{
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif;
  text-anchor:middle;
}
.ground{stroke:var(--border);stroke-width:2;stroke-linecap:round;}
.plan{fill:none;stroke:var(--border);stroke-width:1.4;stroke-dasharray:3 3;stroke-linejoin:round;}
.brk{fill:url(#gBrick);}
.brk-hi{stroke:#fff;stroke-opacity:.35;stroke-width:1;stroke-linecap:round;}
.puff{fill:#e2e8f0;opacity:0;animation:puff 2.4s ease-out infinite;}
.puff.p2{animation-delay:.8s;}
.puff.p3{animation-delay:1.6s;}
@keyframes puff{
  0%{opacity:0;transform:translate(0,0) scale(.6);}
  20%{opacity:.9;}
  100%{opacity:0;transform:translate(6px,-18px) scale(1.8);}
}
.puff{transform-box:fill-box;transform-origin:center;}
@media (prefers-color-scheme:dark){ .puff{fill:#64748b;} }

/* walkers */
.walker{animation:walk 4s linear infinite;}
.w1{transform:translate(82px,121px);}
.w2{transform:translate(194px,121px) scaleX(-1);animation-delay:-2s;}
.w2 .carry{animation-delay:-2s;}

@keyframes walk{
  0%  {transform:translate(82px,121px) scaleX(1);}
  6%  {transform:translate(82px,121px) scaleX(1);}
  44% {transform:translate(194px,121px) scaleX(1);}
  52% {transform:translate(194px,121px) scaleX(1);}
  53% {transform:translate(194px,121px) scaleX(-1);}
  94% {transform:translate(82px,121px) scaleX(-1);}
  99% {transform:translate(82px,121px) scaleX(-1);}
  100%{transform:translate(82px,121px) scaleX(1);}
}

.carry{animation:carry 4s linear infinite;}
@keyframes carry{
  0%,47%{opacity:1;}
  48%,96%{opacity:0;}
  97%,100%{opacity:1;}
}

.bob{animation:bob .2s ease-in-out infinite alternate;}
@keyframes bob{
  from{transform:translateY(0);}
  to{transform:translateY(-1.6px);}
}
.w2 .bob{animation-delay:-.1s;}

.leg{transform-origin:0 0;animation:stride .4s ease-in-out infinite alternate;}
.leg.b{animation-delay:-.4s;}
@keyframes stride{
  from{transform:rotate(-26deg);}
  to{transform:rotate(26deg);}
}

/* figure parts */
.fig .shadow{fill:rgba(15,23,42,.13);}
.fig .pant{stroke:#34528a;stroke-width:4.6;stroke-linecap:round;}
.fig .shoe{fill:#1f2937;}
.fig .vest{fill:url(#gVest);}
.fig .stripe{stroke:#fef08a;stroke-width:1.8;stroke-linecap:round;opacity:.95;}
.fig .arm{stroke:#ffcf3f;stroke-width:3.8;stroke-linecap:round;}
.fig .hand{fill:#ffcf3f;}
.fig .face{fill:url(#gFace);}
.fig .eye{fill:#2b1d14;}
.fig .glint{fill:#fff;}
.fig .smile{fill:none;stroke:#2b1d14;stroke-width:1.4;stroke-linecap:round;}
.fig .cheek{fill:#ff8a7a;opacity:.45;}
.fig .hat{fill:url(#gHat);}
.fig .brim{fill:#e08a00;}
.fig .shine{fill:none;stroke:#fff;stroke-width:1.4;stroke-linecap:round;opacity:.6;}
.fig .handle{stroke:#9a4a0c;stroke-width:2.6;stroke-linecap:round;}
.fig .steel{fill:url(#gSteel);}
@media (prefers-color-scheme:dark){ .fig .shadow{fill:rgba(0,0,0,.45);} }

/* hammering builder */
.hammer{transform-origin:0 0;animation:hammer .9s ease-in infinite;}
@keyframes hammer{
  0%,55%{transform:rotate(-65deg);}
  80%{transform:rotate(18deg);}
  100%{transform:rotate(-65deg);}
}
.spark{opacity:0;animation:spark .9s linear infinite;}
@keyframes spark{
  0%,78%{opacity:0;}
  82%{opacity:1;}
  92%,100%{opacity:0;}
}

/* house pieces drop into place one at a time */
.house .piece{
  opacity:0;
  transform:translateY(-12px);
  transition:opacity .25s ease,transform .4s cubic-bezier(.3,1.6,.5,1);
}
.house .piece.on{opacity:1;transform:none;}

.footer{
  position:relative;
  text-align:center;
  padding:20px 16px 28px;
  font-size:12px;
  color:var(--muted);
}

@media (max-width:480px){
  .header{padding:0 16px;}
  .card{padding:32px 20px 30px;}
  h1{font-size:22px;}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important;}
}
</style>
</head>
<body>

<header class="header">
  <div class="logo">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
  </div>
  WhatsApp Response Bank
</header>

<main class="wrap">
  <div class="card">
    <div class="status"><span class="dot"></span>Under maintenance</div>

    <div class="scene" aria-hidden="true">
      <svg viewBox="0 34 340 92">
        <defs>
          <radialGradient id="gFace" cx="38%" cy="32%" r="75%">
            <stop offset="0" stop-color="#fff0a3"/>
            <stop offset=".45" stop-color="#ffd23f"/>
            <stop offset="1" stop-color="#f4a417"/>
          </radialGradient>
          <linearGradient id="gHat" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffe066"/>
            <stop offset="1" stop-color="#f59e0b"/>
          </linearGradient>
          <linearGradient id="gVest" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fb923c"/>
            <stop offset="1" stop-color="#ea580c"/>
          </linearGradient>
          <linearGradient id="gPant" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#3b5b92"/>
            <stop offset="1" stop-color="#2a4271"/>
          </linearGradient>
          <linearGradient id="gWood" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#b45309"/>
            <stop offset="1" stop-color="#7c3a0a"/>
          </linearGradient>
          <linearGradient id="gSteel" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#cbd5e1"/>
            <stop offset="1" stop-color="#64748b"/>
          </linearGradient>
          <linearGradient id="gBrick" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f28a5e"/>
            <stop offset="1" stop-color="#d45f3a"/>
          </linearGradient>
          <pattern id="pBrick" width="12" height="7.5" patternUnits="userSpaceOnUse" x="224" y="121">
            <rect width="12" height="7.5" fill="#f7d6c1"/>
            <rect x=".5" y=".5" width="11" height="3" rx=".8" fill="#e27b52"/>
            <rect x="-5.5" y="4.25" width="11" height="3" rx=".8" fill="#d96d47"/>
            <rect x="6.5" y="4.25" width="11" height="3" rx=".8" fill="#d96d47"/>
          </pattern>
          <linearGradient id="gWallShade" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#fff" stop-opacity=".18"/>
            <stop offset=".6" stop-color="#fff" stop-opacity="0"/>
            <stop offset="1" stop-color="#000" stop-opacity=".10"/>
          </linearGradient>
          <linearGradient id="gRoof" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f26b5b"/>
            <stop offset="1" stop-color="#c93a2f"/>
          </linearGradient>
          <linearGradient id="gDoor" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#8a5634"/>
            <stop offset="1" stop-color="#5e3620"/>
          </linearGradient>
          <linearGradient id="gGlass" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#d6efff"/>
            <stop offset="1" stop-color="#6fb9ef"/>
          </linearGradient>
        </defs>

        <!-- ground -->
        <line class="ground" x1="4" y1="121" x2="336" y2="121"/>

        <!-- brick pile -->
        <g><rect class="brk" x="12" y="113" width="17" height="7.5" rx="1.8"/><line class="brk-hi" x1="14" y1="114.6" x2="27" y2="114.6"/><rect class="brk" x="30" y="113" width="17" height="7.5" rx="1.8"/><line class="brk-hi" x1="32" y1="114.6" x2="45" y2="114.6"/><rect class="brk" x="48" y="113" width="17" height="7.5" rx="1.8"/><line class="brk-hi" x1="50" y1="114.6" x2="63" y2="114.6"/><rect class="brk" x="21" y="105" width="17" height="7.5" rx="1.8"/><line class="brk-hi" x1="23" y1="106.6" x2="36" y2="106.6"/><rect class="brk" x="39" y="105" width="17" height="7.5" rx="1.8"/><line class="brk-hi" x1="41" y1="106.6" x2="54" y2="106.6"/><rect class="brk" x="30" y="97" width="17" height="7.5" rx="1.8"/><line class="brk-hi" x1="32" y1="98.6" x2="45" y2="98.6"/></g>

        <!-- dashed plan of the house -->
        <rect class="plan" x="224" y="76" width="58" height="45" rx="2"/>
        <path class="plan" d="M217 77 L253 47 L289 77 Z"/>

        <!-- the house, revealed in data-step order -->
        <g class="house" id="house">
          <!-- foundation -->
          <rect class="piece" data-step="1" x="220" y="117" width="66" height="5" rx="2.5" fill="#94a3b8"/>
          <!-- walls, three courses of brick -->
          <g class="piece" data-step="2"><rect x="224" y="106" width="58" height="12" fill="url(#pBrick)"/><rect x="224" y="106" width="58" height="12" fill="url(#gWallShade)"/></g>
          <g class="piece" data-step="3"><rect x="224" y="91" width="58" height="15.5" fill="url(#pBrick)"/><rect x="224" y="91" width="58" height="15.5" fill="url(#gWallShade)"/></g>
          <g class="piece" data-step="4"><rect x="224" y="76" width="58" height="15.5" fill="url(#pBrick)"/><rect x="224" y="76" width="58" height="15.5" fill="url(#gWallShade)"/></g>
          <!-- door -->
          <g class="piece" data-step="5">
            <rect x="244.5" y="97.5" width="17" height="20" rx="1.5" fill="#f8fafc"/>
            <path d="M246.5 117 V105 a6.5 6.5 0 0 1 13 0 V117 Z" fill="url(#gDoor)"/>
            <circle cx="257" cy="110" r="1.1" fill="#fbbf24"/>
          </g>
          <!-- windows -->
          <g class="piece" data-step="6">
            <rect x="228" y="82" width="14" height="14" rx="2" fill="#f8fafc"/>
            <rect x="229.6" y="83.6" width="10.8" height="10.8" rx="1" fill="url(#gGlass)"/>
            <path d="M235 83.6 V94.4 M229.6 89 H240.4" stroke="#f8fafc" stroke-width="1.4"/>
            <rect x="226.5" y="95.5" width="17" height="2.4" rx="1.2" fill="#e2e8f0"/>
          </g>
          <g class="piece" data-step="7">
            <rect x="264" y="82" width="14" height="14" rx="2" fill="#f8fafc"/>
            <rect x="265.6" y="83.6" width="10.8" height="10.8" rx="1" fill="url(#gGlass)"/>
            <path d="M271 83.6 V94.4 M265.6 89 H276.4" stroke="#f8fafc" stroke-width="1.4"/>
            <rect x="262.5" y="95.5" width="17" height="2.4" rx="1.2" fill="#e2e8f0"/>
          </g>
          <!-- chimney (drawn behind the roof, built after it) -->
          <g class="piece" data-step="9">
            <rect x="268" y="51" width="10" height="20" rx="1.2" fill="#c0503f"/>
            <rect x="266.5" y="48.5" width="13" height="4" rx="1.5" fill="#8f3128"/>
          </g>
          <!-- roof -->
          <g class="piece" data-step="8">
            <path d="M214 79 L253 45.5 L292 79 Z" fill="url(#gRoof)" stroke="#c93a2f" stroke-width="3" stroke-linejoin="round"/>
            <path d="M222 74 L253 47.6" stroke="#fff" stroke-opacity=".35" stroke-width="1.6" stroke-linecap="round"/>
            <rect x="212" y="77" width="82" height="4.5" rx="2.25" fill="#a92f26"/>
            <circle cx="253" cy="64" r="5" fill="#f8fafc"/>
            <circle cx="253" cy="64" r="3.6" fill="url(#gGlass)"/>
          </g>
          <!-- smoke, once the house is finished -->
          <g class="piece" data-step="10">
            <circle class="puff p1" cx="273" cy="44" r="3.2"/>
            <circle class="puff p2" cx="273" cy="44" r="3.2"/>
            <circle class="puff p3" cx="273" cy="44" r="3.2"/>
          </g>
        </g>

        <!-- builder hammering, right of the house -->
        <g transform="translate(314,121) scale(-1,1)">
          <g class="fig">
            <ellipse class="shadow" cx="0" cy="0" rx="10" ry="2"/>
            <line class="pant" x1="-3" y1="-11" x2="-4" y2="-3"/>
            <line class="pant" x1="3" y1="-11" x2="4" y2="-3"/>
            <ellipse class="shoe" cx="-3" cy="-1.4" rx="3" ry="1.9"/>
            <ellipse class="shoe" cx="5.5" cy="-1.4" rx="3" ry="1.9"/>
            <path class="vest" d="M-7 -24 h14 a3 3 0 0 1 3 3 v8 a3 3 0 0 1 -3 3 h-14 a3 3 0 0 1 -3 -3 v-8 a3 3 0 0 1 3 -3 z"/>
              <line class="stripe" x1="-7" y1="-17.5" x2="7" y2="-17.5"/>
              <line class="stripe" x1="-7" y1="-13.5" x2="7" y2="-13.5"/>
            <line class="arm" x1="-5" y1="-20" x2="-9" y2="-14"/>
            <circle class="hand" cx="-9.3" cy="-13.5" r="2.3"/>
            <circle class="face" cx="0" cy="-33" r="9.5"/>
              <ellipse class="eye" cx="2.2" cy="-33.5" rx="1.25" ry="1.6"/>
              <ellipse class="eye" cx="6.6" cy="-33.5" rx="1.25" ry="1.6"/>
              <circle class="glint" cx="2.6" cy="-34.1" r=".45"/>
              <circle class="glint" cx="7" cy="-34.1" r=".45"/>
              <path class="smile" d="M1.6 -29.4 q2.8 2.6 5.6 0"/>
              <ellipse class="cheek" cx="8.4" cy="-30.4" rx="1.7" ry="1.1"/>
              <ellipse class="cheek" cx="-.6" cy="-30.4" rx="1.5" ry="1"/>
              <path class="hat" d="M-10.2 -36 C-10.2 -47 10.2 -47 10.2 -36 Z"/>
              <rect class="brim" x="-8" y="-37" width="21" height="3" rx="1.5"/>
              <path class="shine" d="M-5.5 -40.5 q2.5 -3.4 6.5 -3.6"/>
            <g transform="translate(4,-20)">
              <g class="hammer">
                <line class="handle" x1="8" y1="3" x2="8" y2="-9"/>
                <rect class="steel" x="2.5" y="-13" width="11" height="4.6" rx="1.2"/>
                <line class="arm" x1="0" y1="0" x2="7" y2="0"/>
                <circle class="hand" cx="8" cy="0" r="2.3"/>
              </g>
            </g>
          </g>
          <g class="spark" stroke="#fbbf24" stroke-width="1.6" stroke-linecap="round">
            <line x1="18" y1="-24" x2="22" y2="-28"/>
            <line x1="19" y1="-19" x2="24" y2="-19"/>
            <line x1="18" y1="-14" x2="22" y2="-11"/>
          </g>
        </g>

        <!-- walker 1 -->
        <g class="walker w1">
          <g class="fig">
            <ellipse class="shadow" cx="0" cy="0" rx="10" ry="2"/>
            <g transform="translate(-3,-11)"><g class="leg a"><line class="pant" x1="0" y1="0" x2="0" y2="8"/><ellipse class="shoe" cx="1.4" cy="9.6" rx="3" ry="1.9"/></g></g>
            <g transform="translate(3,-11)"><g class="leg b"><line class="pant" x1="0" y1="0" x2="0" y2="8"/><ellipse class="shoe" cx="1.4" cy="9.6" rx="3" ry="1.9"/></g></g>
            <g class="bob">
              <path class="vest" d="M-7 -24 h14 a3 3 0 0 1 3 3 v8 a3 3 0 0 1 -3 3 h-14 a3 3 0 0 1 -3 -3 v-8 a3 3 0 0 1 3 -3 z"/>
              <line class="stripe" x1="-7" y1="-17.5" x2="7" y2="-17.5"/>
              <line class="stripe" x1="-7" y1="-13.5" x2="7" y2="-13.5"/>
              <g class="carry"><rect class="brk" x="8" y="-22.5" width="15" height="7" rx="1.6"/><line class="brk-hi" x1="10" y1="-21" x2="21" y2="-21"/></g>
              <line class="arm" x1="4" y1="-20" x2="10" y2="-17"/>
              <circle class="hand" cx="10.5" cy="-16.8" r="2.3"/>
              <circle class="face" cx="0" cy="-33" r="9.5"/>
              <ellipse class="eye" cx="2.2" cy="-33.5" rx="1.25" ry="1.6"/>
              <ellipse class="eye" cx="6.6" cy="-33.5" rx="1.25" ry="1.6"/>
              <circle class="glint" cx="2.6" cy="-34.1" r=".45"/>
              <circle class="glint" cx="7" cy="-34.1" r=".45"/>
              <path class="smile" d="M1.6 -29.4 q2.8 2.6 5.6 0"/>
              <ellipse class="cheek" cx="8.4" cy="-30.4" rx="1.7" ry="1.1"/>
              <ellipse class="cheek" cx="-.6" cy="-30.4" rx="1.5" ry="1"/>
              <path class="hat" d="M-10.2 -36 C-10.2 -47 10.2 -47 10.2 -36 Z"/>
              <rect class="brim" x="-8" y="-37" width="21" height="3" rx="1.5"/>
              <path class="shine" d="M-5.5 -40.5 q2.5 -3.4 6.5 -3.6"/>
            </g>
          </g>
        </g>

        <!-- walker 2 -->

<script>
(function(){
  var bricks = Array.prototype.slice.call(document.querySelectorAll('#house .piece'))
    .sort(function(a,b){ return a.dataset.step - b.dataset.step; });
  var N = bricks.length;
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    bricks.forEach(function(b){ b.classList.add('on'); });
    return;
  }

  var walker = document.querySelector('.w1');
  var t0 = performance.now();
  var shown = -1;

  function elapsed(){
    try {
      var a = walker.getAnimations && walker.getAnimations()[0];
      if (a && a.currentTime != null) return a.currentTime;
    } catch(e) {}
    return performance.now() - t0;
  }

  function tick(){
    var drops = Math.floor((elapsed() + 80) / 2000) + 1;
    var slot = (drops - 1) % (N + 2) + 1;  
    var placed = Math.min(N, slot);
    if (placed !== shown) {
      bricks.forEach(function(b, i){ b.classList.toggle('on', i < placed); });
      shown = placed;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
