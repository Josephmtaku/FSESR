<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp Response Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7f9;
  --surface:#ffffff;
  --border:#e6e8ec;
  --text:#0f172a;
  --muted:#64748b;
  --accent:#16a34a;
  --accent-soft:rgba(22,163,74,.10);
  --grid:rgba(15,23,42,.045);
  --shadow:0 1px 2px rgba(15,23,42,.04),0 12px 32px -12px rgba(15,23,42,.12);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0b0f14;
    --surface:#11161d;
    --border:#1f2731;
    --text:#e6edf3;
    --muted:#8b98a7;
    --accent:#22c55e;
    --accent-soft:rgba(34,197,94,.12);
    --grid:rgba(255,255,255,.035);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 16px 40px -16px rgba(0,0,0,.6);
  }
}

*{box-sizing:border-box;}

html,body{height:100%;}

body{
  margin:0;
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  display:flex;
  flex-direction:column;
  min-height:100vh;
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:44px 44px;
  background-position:center center;
}

/* soft glow behind card */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:radial-gradient(600px circle at 50% 45%,var(--accent-soft),transparent 70%);
  pointer-events:none;
}

/* HEADER */
.header{
  position:relative;
  height:64px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 28px;
  background:color-mix(in srgb,var(--surface) 80%,transparent);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  font-size:15px;
  font-weight:600;
  letter-spacing:-.01em;
}
.logo{
  width:28px;height:28px;
  border-radius:8px;
  background:var(--accent);
  display:grid;place-items:center;
  flex-shrink:0;
}

/* MAIN */
.wrap{
  position:relative;
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px 16px;
}

.card{
  width:100%;
  max-width:480px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:var(--shadow);
  padding:44px 40px 36px;
  text-align:center;
  animation:rise .6s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes rise{
  from{opacity:0;transform:translateY(12px);}
  to{opacity:1;transform:none;}
}

.status{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:6px 12px;
  border-radius:999px;
  background:var(--accent-soft);
  color:var(--accent);
  font-size:12px;
  font-weight:600;
  letter-spacing:.02em;
  margin-bottom:24px;
}
.dot{
  position:relative;
  width:8px;height:8px;
  border-radius:50%;
  background:var(--accent);
}
.dot::after{
  content:"";
  position:absolute;inset:0;
  border-radius:50%;
  background:var(--accent);
  animation:ping 1.8s cubic-bezier(0,0,.2,1) infinite;
}
@keyframes ping{
  75%,100%{transform:scale(2.4);opacity:0;}
}

.icon{
  width:64px;height:64px;
  margin:0 auto 22px;
  border-radius:16px;
  border:1px solid var(--border);
  background:var(--bg);
  display:grid;place-items:center;
}
.icon svg{animation:turn 6s ease-in-out infinite;}
@keyframes turn{
  0%,100%{transform:rotate(0deg);}
  50%{transform:rotate(-14deg);}
}

h1{
  font-size:26px;
  font-weight:700;
  letter-spacing:-.025em;
  margin:0 0 10px;
}

p{
  font-size:15px;
  line-height:1.65;
  color:var(--muted);
  margin:0 auto;
  max-width:360px;
}

/* indeterminate progress */
.bar{
  margin:30px auto 0;
  height:4px;
  width:100%;
  max-width:260px;
  border-radius:999px;
  background:var(--border);
  overflow:hidden;
  position:relative;
}
.bar::before{
  content:"";
  position:absolute;
  top:0;bottom:0;
  width:40%;
  border-radius:999px;
  background:var(--accent);
  animation:slide 1.6s ease-in-out infinite;
}
@keyframes slide{
  0%{left:-40%;}
  100%{left:100%;}
}

.footer{
  position:relative;
  text-align:center;
  padding:20px 16px 28px;
  font-size:12px;
  color:var(--muted);
}

@media (max-width:480px){
  .header{padding:0 16px;}
  .card{padding:36px 22px 30px;}
  h1{font-size:22px;}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;}
}
</style>
</head>
<body>

<header class="header">
  <div class="logo">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
  </div>
  University WhatsApp Response Bank
</header>

<main class="wrap">
  <div class="card">
    <div class="status"><span class="dot"></span>Under maintenance</div>

    <div class="icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
    </div>

    <h1>We'll be back soon</h1>
    <p>The Response Bank is temporarily unavailable while maintenance is carried out. Thanks for your patience.</p>

    <div class="bar" aria-hidden="true"></div>
  </div>
</main>

<footer class="footer">University WhatsApp Response Bank</footer>

</body>
</html>
