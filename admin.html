<!DOCTYPE html>
<html>

<head>

<title>Admin – Upload Response Bank</title>

<script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

body{
font-family: Arial;
padding:40px;
background:#f5f6fa;
}

h2{
margin-bottom:10px;
}

button{
padding:10px 18px;
background:#1e88e5;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
font-size:15px;
}

button:hover{
opacity:0.9;
}

#status{
margin-top:15px;
font-weight:500;
}

</style>

</head>

<body>

<h2>Upload Response Bank</h2>

<p>Select the Word document containing the response table.</p>

<input type="file" id="file" accept=".docx">

<br><br>

<button onclick="upload()">Upload Document</button>

<p id="status"></p>


<script>

const supabaseClient = supabase.createClient(
"https://vpuwpgwonvgczbsehboa.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZwdXdwZ3dvbnZnY3pic2VoYm9hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMyMjU1NjQsImV4cCI6MjA4ODgwMTU2NH0.PK-D0NSBKCPUOTQxcDIIEeU0Goa5AotV_fB-baw062c"
);



async function upload(){

let file = document.getElementById("file").files[0];

if(!file){
alert("Please select a Word document");
return;
}

document.getElementById("status").innerText="Processing document...";

let reader = new FileReader();

reader.onload = function(e){

mammoth.convertToHtml({arrayBuffer:e.target.result})
.then(async function(result){

let temp=document.createElement("div");
temp.innerHTML=result.value;

let rows=temp.querySelectorAll("tr");

let responses=[];



rows.forEach((row,i)=>{

let cells=row.querySelectorAll("td");

if(cells.length>=2 && i>0){

let title=cells[0].innerText.trim();

let div=document.createElement("div");
div.innerHTML=cells[1].innerHTML;



/* ---------- CONVERT WORD HYPERLINKS ---------- */

let links=div.querySelectorAll("a");

links.forEach(link=>{

let text = link.innerText.trim();
let url = link.href.trim();

url = url.replace(/[.,;!]+$/,"");

let replacement = text + " - " + url;

link.replaceWith(replacement);

});



/* ---------- DETECT RAW URLS ---------- */

let html = div.innerHTML;

html = html.replace(
/https?:\/\/[^\s<]+/g,
function(match){

return match.replace(/[.,;!]+$/,"");

}
);

div.innerHTML = html;



/* ---------- PRESERVE FORMATTING ---------- */

let formatted="";

div.childNodes.forEach(node=>{

if(node.nodeName==="P"){

let txt=node.innerText.trim();

if(txt){
formatted += txt + "\n\n";
}

}

else if(node.nodeName==="UL"){

node.querySelectorAll("li").forEach(li=>{
formatted += "• " + li.innerText.trim() + "\n";
});

formatted += "\n";

}

else if(node.nodeType===3){

let txt=node.textContent.trim();

if(txt){
formatted += txt + "\n\n";
}

}

});



/* ---------- FINAL SAFE LINK CLEANUP ---------- */

formatted = formatted.replace(
/(https?:\/\/[^\s]+?)([.,;!]+)(?=\s|$)/g,
"$1"
);



responses.push({
title:title,
response:formatted.trim()
});

}

});



if(responses.length===0){

document.getElementById("status").innerText="No responses found in document.";

return;

}



/* ---------- CLEAR OLD RESPONSES ---------- */

await supabaseClient
.from("responses")
.delete()
.not("id","is",null);



/* ---------- INSERT NEW RESPONSES ---------- */

let {error} = await supabaseClient
.from("responses")
.insert(responses);



if(error){

document.getElementById("status").innerText="Upload failed: "+error.message;

}else{

document.getElementById("status").innerText=
"Upload successful. "+responses.length+" responses added.";

}

});

};

reader.readAsArrayBuffer(file);

}

</script>

</body>

</html>
